name: sums_app
description: "SUMS — Sistema Unificado de Manejo de Salud (IMSS Bienestar). Arquitectura Clean Architecture + MVVM con seguridad de Nivel 1."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Seguridad: Única fuente autorizada para credenciales. SharedPreferences prohibido para datos sensibles.
  permission_handler: ^12.0.1
  provider: ^6.1.2
  flutter_local_notifications: ^18.0.1
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
